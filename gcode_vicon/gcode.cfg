[General]
tool_length = 0.0
margin = 0.90
allow_walking = false
draw_on_wall = false
velocity = 0.05
travel_z = 0.20
below_z_is_admittance = 0.0
press_force_percent = -0.001
draw_z_offset = 0.003
min_dist_to_goal = 0.03
use_vision_frame = true
use_xy_to_z_cross_term = false
bias_force_x = 0
# Slow descent during touch-to-find-ground (m/s); keep low for POSCA/brush safety
touchdown_velocity = 0.02
# Gripper holding torque in N*mm; reduce for thin brush handles (e.g. 10.0)
gripper_torque = 15.0
# Arm workspace limits: drawing area is clamped to these extents regardless of canvas size.
# arm_draw_x_mm limits forward depth (canvas y_axis direction).
# arm_draw_y_mm limits lateral width (canvas x_axis direction).
# Keep arm_draw_y_mm <= 340 so the drawing edge stays clear of the front legs (at ±170mm).
arm_draw_x_mm = 280
arm_draw_y_mm = 320
